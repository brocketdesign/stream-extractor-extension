<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
<body>
<header class="head">
  <strong>Streams on this page</strong>
  <span class="btn-row">
    <button id="rescan" class="btn btn--sm btn--ghost" title="Scan the page again">Rescan</button>
    <button id="clear" class="btn btn--sm btn--ghost" title="Forget everything found on this tab">Clear</button>
  </span>
</header>
<p id="status" class="status">scanning…</p>
<ul id="list"></ul>
<footer class="foot">
  <div class="foot__row">
    <label class="check"><input type="checkbox" id="showSegments"> Show HLS segments</label>
    <a href="#" id="libraryLink" class="link">Library →</a>
  </div>
  <label class="check"><input type="checkbox" id="notifyToggle"> Pop up on the page when a stream is found</label>
</footer>
<script src="popup.js"></script>
